{% extends "base.html" %}
{% block title %}Log in — MaxAds{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center p-4">
  <form method="post" action="/login" class="w-full max-w-sm card card-loud p-7 space-y-5 tilt">
    <div class="text-center">
      <div class="text-5xl mb-1">📣</div>
      <h1 class="wordmark text-4xl">MaxAds</h1>
      <p class="mt-3 font-bold text-sm" style="color:var(--ink-soft)">
        Ads nobody ordered.
      </p>
    </div>

    {% if error %}
      <p class="text-sm font-bold text-white px-3 py-2 rounded-xl border-[3px]"
         style="background:var(--pop);border-color:var(--ink)">🙅 {{ error }}</p>
    {% endif %}

    <label class="block">
      <span class="text-sm font-black uppercase tracking-wide">Username</span>
      <input name="username" autocomplete="username" required autofocus class="field mt-1">
    </label>
    <label class="block">
      <span class="text-sm font-black uppercase tracking-wide">Password</span>
      <input name="password" type="password" autocomplete="current-password" required class="field mt-1">
    </label>
    <button class="btn btn-main w-full py-3 text-lg">Let me in! 🚀</button>
  </form>
</div>
{% endblock %}
