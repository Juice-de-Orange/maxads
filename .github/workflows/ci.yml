name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # The two video tests skip themselves without ffmpeg; here they must run.
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m compileall -q app
      - name: Tests (no skips allowed)
        run: |
          python -m pytest -q -rs | tee pytest.log
          if grep -q '^SKIPPED' pytest.log; then echo "::error::tests were skipped"; exit 1; fi

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: cp .env.example .env
      - name: Compose file is valid
        run: docker compose config --quiet
      - name: Build and start, then probe
        run: |
          docker compose up -d --build
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '^OK'
          # A generated first-admin password is announced once on stderr.
          docker compose logs web | grep -q 'First admin created'
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/login | grep -q 200
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()

  secrets:
    # Full-history secret scan on every PR and push. Same tool and version as
    # the pre-commit hook (.pre-commit-config.yaml).
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history
        run: ./gitleaks git . --redact --no-banner
