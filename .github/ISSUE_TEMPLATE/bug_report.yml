name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Security problems go through private reporting instead
        (Security → Report a vulnerability), never a public issue.
        Please remove passwords, secret keys, public IPs and hostnames from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. .env with …
        2. docker compose up -d
        3. upload a … file
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Commit (`git rev-parse --short HEAD`) and how you run it (Docker / systemd).
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - dashboard / upload
        - media processing (images, videos)
        - embedding (script, iframe, image, JSON)
        - counting (impressions, clicks, sites)
        - deployment (Docker, systemd, reverse proxy)
        - docs
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: "`docker compose logs web worker` or `journalctl -u maxads -u maxads-worker`."
      render: shell
